name: One-time SVGO path pass
on:
  push:
    branches:
      - chore/svgo-inline-svg-optimization

permissions:
  contents: write

jobs:
  optimize-inline-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run svg:optimize
      - run: npm run svg:check
      - run: npm run typecheck
      - name: Commit path-only optimizations on the feature branch
        run: |
          if git diff --quiet -- src; then
            echo "No further path-data reductions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "perf(svg): apply SVGO path geometry optimization"
          git push origin HEAD:chore/svgo-inline-svg-optimization
