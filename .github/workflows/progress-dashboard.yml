name: Progress dashboard checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/screens/ProgressScreen.tsx"
      - "src/screens/ResultsScreen.tsx"
      - "src/screens/WeeklyReviewScreen.tsx"
      - "scripts/test-weekly-review.cjs"
      - "scripts/test-lesson-results.cjs"
      - "src/components/ProgressGradientBackground.tsx"
      - "src/components/ProgressMotion.tsx"
      - "src/components/ProgressTrack.tsx"
      - "src/components/HomeMotion.tsx"
      - "src/screens/LearningInsightsScreen.tsx"
      - "src/navigation/AppNavigator.tsx"
      - "src/navigation/navigationRules.ts"
      - "src/hooks/useLearningApp.ts"
      - "src/state/LearningSession.tsx"
      - "src/state/LearningStore.ts"
      - "src/state/DailyStore.ts"
      - "src/hooks/useKnowledgeProfile.ts"
      - "src/screens/ProfileScreen.tsx"
      - "src/components/AtlasCard.tsx"
      - "src/components/AtlasContinueCard.tsx"
      - "src/screens/PlayerStatsScreen.tsx"
      - "src/components/ProfileSectionHeader.tsx"
      - "src/screens/AccountScreen.tsx"
      - "src/screens/DailyChallengePreferencesScreen.tsx"
      - "src/components/BottomNavigation.tsx"
      - "src/components/ReviewActions.tsx"
      - "src/components/ActionButton.tsx"
      - "src/components/KnowledgeMastery.tsx"
      - "src/components/LearningDetailSections.tsx"
      - "src/components/SubjectProgressTile.tsx"
      - "src/components/LearningActivityPanel.tsx"
      - "src/components/NavigationTile.tsx"
      - "src/components/MetricCard.tsx"
      - "src/utils/categoryCompletion.ts"
      - "scripts/test-progress-layout.cjs"
      - "scripts/test-progress-track.cjs"
      - "scripts/test-navigation-rules.cjs"
      - "scripts/test-profile-layout.cjs"
      - "scripts/test-learning-detail-sections.cjs"
      - "scripts/test-subject-progress-tile.cjs"
      - "scripts/test-shared-navigation-metrics.cjs"
      - "scripts/test-atlas-card-primitives.cjs"
      - "scripts/test-profile-section-header.cjs"
      - "scripts/test-profile-fourth-tab.cjs"
      - "scripts/test-learning-activity.cjs"
      - "scripts/test-category-completion.cjs"
      - "scripts/test-knowledge-review-ui.cjs"
      - ".github/workflows/progress-dashboard.yml"
  workflow_dispatch:

jobs:
  progress-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-navigation-rules.cjs
      - run: node scripts/test-progress-layout.cjs
      - run: node scripts/test-lesson-results.cjs
      - run: node scripts/test-weekly-review.cjs
      - run: node scripts/test-progress-track.cjs
      - run: node scripts/test-profile-layout.cjs
      - run: node scripts/test-learning-detail-sections.cjs
      - run: node scripts/test-subject-progress-tile.cjs
      - run: node scripts/test-shared-navigation-metrics.cjs
      - run: node scripts/test-atlas-card-primitives.cjs
      - run: node scripts/test-profile-section-header.cjs
      - run: node scripts/test-profile-fourth-tab.cjs
      - run: node scripts/test-learning-activity.cjs
      - run: node scripts/test-category-completion.cjs
      - run: node scripts/test-knowledge-review-ui.cjs
