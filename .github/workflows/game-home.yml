name: Game home and adventure path checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/screens/HomeScreen.tsx"
      - "src/screens/SubcategoryScreen.tsx"
      - "src/screens/CategoryScreen.tsx"
      - "src/components/AtlasContinueCard.tsx"
      - "src/components/AtlasCard.tsx"
      - "src/components/FantasyMap.tsx"
      - "src/components/IslandAtlasMap.tsx"
      - "src/components/CategoryWorldAtlasBackground.tsx"
      - "assets/atlas-source/category-world.svg"
      - "assets/atlas-source/natural-earth-110m-land.geojson"
      - "scripts/generate-category-world-svg.mjs"
      - "assets/atlas-export-preview/category-world.webp"
      - "scripts/export-category-world-webp.cjs"
      - "src/components/worldIcons/**"
      - "src/components/islandIcons/**"
      - "src/components/HomeMotion.tsx"
      - "src/components/AdventureAtlasBackground.tsx"
      - "src/components/AdventureMotion.tsx"
      - "package.json"
      - "package-lock.json"
      - "src/utils/categoryAtlas.ts"
      - "src/navigation/AppNavigator.tsx"
      - "src/components/BottomNavigation.tsx"
      - "src/hooks/useLearningApp.ts"
      - "scripts/test-home-layout.cjs"
      - "scripts/test-category-atlas.cjs"
      - "scripts/test-atlas-card-primitives.cjs"
      - ".github/workflows/game-home.yml"
  workflow_dispatch:

jobs:
  home-adventure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run atlas:world:svg:check
      - run: npm run atlas:world:check
      - run: npm run typecheck
      - run: node scripts/test-home-layout.cjs
      - run: node scripts/test-category-atlas.cjs
      - run: node scripts/test-atlas-card-primitives.cjs
      - run: node scripts/test-ancient-greece-order-v2.cjs
      - run: npm run validate:content
