name: Game home and adventure path checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/screens/HomeScreen.tsx"
      - "src/screens/SubcategoryScreen.tsx"
      - "src/screens/CategoryScreen.tsx"
      - "src/components/FantasyMap.tsx"
      - "src/utils/categoryAtlas.ts"
      - "src/navigation/AppNavigator.tsx"
      - "src/components/BottomNavigation.tsx"
      - "src/hooks/useLearningApp.ts"
      - "scripts/test-home-layout.cjs"
      - "scripts/test-category-atlas.cjs"
      - ".github/workflows/game-home.yml"
  workflow_dispatch:

jobs:
  home-adventure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-home-layout.cjs
      - run: node scripts/test-category-atlas.cjs
      - run: node scripts/test-ancient-greece-order-v2.cjs
      - run: npm run validate:content
