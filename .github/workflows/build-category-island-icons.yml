name: Export Category Island Landmark WebPs

on:
  push:
    branches:
      - feat/category-island-atlas-v2
    paths:
      - src/components/islandIcons/AncientGreeceIslandIcon.tsx
      - src/components/islandIcons/WorldHistoryIslandIcon.tsx
      - src/components/islandIcons/MythologyIslandIcon.tsx
      - scripts/export-island-icons-webp.cjs
      - .github/workflows/build-category-island-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-landmarks:
    if: github.repository == 'its-manos/project-gnosi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/category-island-atlas-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rasterize landmark SVG components at 256px with transparent backgrounds
        run: npm run atlas:islands:export
      - name: Commit only generated WebP assets
        shell: bash
        run: |
          git add assets/atlas-export-preview/island-icons/*.webp
          if git diff --cached --quiet; then
            echo "Landmark WebP assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(atlas): generate transparent History landmark WebPs from SVG sources"
          git pull --rebase origin feat/category-island-atlas-v2
          git push origin HEAD:feat/category-island-atlas-v2
