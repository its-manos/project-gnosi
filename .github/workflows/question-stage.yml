name: Question stage checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/*QuestionCard.tsx"
      - "src/components/InlineQuestionCard.tsx"
      - "src/components/QuizQuestionRenderer.tsx"
      - "src/components/QuizReveal.tsx"
      - "src/components/questionCardStyles.ts"
      - "src/screens/ReaderLessonScreen.tsx"
      - "src/screens/QuizTypesPreviewScreen.tsx"
      - "src/screens/QuizScreen.tsx"
      - "src/navigation/AppNavigator.tsx"
      - "src/components/QuestionStageFooter.tsx"
      - "src/components/QuestionFeedbackPanel.tsx"
      - "src/hooks/useQuestionStageAction.ts"
      - "scripts/test-quiz-spot-blank-cards.cjs"
      - "src/screens/DailyChallengeScreen.tsx"
      - "src/screens/WelcomeScreen.tsx"
      - "src/screens/OnboardingDailyQuestion.tsx"
      - "src/screens/onboardingLayout.ts"
      - "src/hooks/useWelcome.ts"
      - "src/utils/firstRun.ts"
      - "scripts/test-welcome.cjs"
      - "src/components/LessonIntroductionModal.tsx"
      - "src/components/lessonIntroductionStyles.ts"
      - "src/screens/readerLessonStyles.ts"
      - "src/components/ScreenEntrance.tsx"
      - "src/play/**"
      - "assets/sounds/lesson-*.wav"
      - "assets/sounds/world-open.wav"
      - "assets/sounds/island-open.wav"
      - "scripts/test-lesson-entrance.cjs"
      - "scripts/test-sound-feedback-queue.cjs"
      - "scripts/generate-learning-feedback.cjs"
      - "scripts/helpers/synthesize-feedback.cjs"
      - "scripts/test-sound-palette.cjs"
      - "scripts/test-android-feedback-audio.cjs"
      - "assets/sounds/*.wav"
      - "scripts/test-lesson-introduction.cjs"
      - "src/quiz/quickQuiz.ts"
      - "src/screens/QuickQuizScreen.tsx"
      - "scripts/test-quick-quiz.cjs"
      - "scripts/test-question-open-audio.cjs"
      - "src/components/WelcomeStepIcons.tsx"
      - "src/components/DailyMissionMap.tsx"
      - "src/components/DailyJourneyTrack.tsx"
      - "src/hooks/useAdaptiveQuestionScroll.ts"
      - "scripts/test-question-stage.cjs"
      - "scripts/test-question-stage-footer.cjs"
      - "scripts/test-question-feedback.cjs"
      - "scripts/test-question-footer-motion.cjs"
      - "scripts/test-daily-phase3-ui.cjs"
      - "scripts/test-profile-section-header.cjs"
      - "scripts/test-quiz-reveal.cjs"
      - ".github/workflows/question-stage.yml"
  workflow_dispatch:

jobs:
  question-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:lesson-question-card
      - run: npm run test:question-types
      - run: npm run test:section-end-questions
      - run: node scripts/test-reader-pilot.cjs
      - run: node scripts/test-reader-visual-hierarchy.cjs
      - run: node scripts/test-reader-resume-anchors.cjs
      - run: node scripts/test-expandable-image-caption.cjs
      - run: node scripts/test-reader-text-size.cjs
      - run: node scripts/test-article-images.cjs
      - run: node scripts/test-typed-lesson-integration.cjs
      - run: node scripts/test-daily-challenge.cjs
      - run: node scripts/test-welcome.cjs
      - run: node scripts/test-lesson-introduction.cjs
      - run: node scripts/test-lesson-entrance.cjs
      - run: node scripts/test-play-audio.cjs
      - run: node scripts/test-android-feedback-audio.cjs
      - run: node scripts/test-answer-sound-route.cjs
      - run: node scripts/test-sound-feedback-queue.cjs
      - run: node scripts/test-sound-palette.cjs
      - run: node scripts/test-play-feedback.cjs
      - run: node scripts/test-play-feedback-ui.cjs
      - run: node scripts/test-weekly-review.cjs
      - run: node scripts/test-quick-quiz.cjs
      - run: node scripts/test-question-open-audio.cjs
      - run: node scripts/test-profile-section-header.cjs
      - run: node scripts/test-daily-phase3-ui.cjs
      - run: node scripts/test-quiz-reveal.cjs
      - run: node scripts/test-question-stage.cjs
      - run: node scripts/test-question-stage-footer.cjs
      - run: node scripts/test-question-feedback.cjs
      - run: node scripts/test-question-footer-motion.cjs
