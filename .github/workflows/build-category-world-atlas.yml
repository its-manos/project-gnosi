name: Build Category World Atlas WebP

on:
  push:
    branches:
      - feat/category-island-atlas-v2
    paths:
      - assets/atlas-source/category-world.svg
      - assets/atlas-source/natural-earth-110m-land.geojson
      - scripts/generate-category-world-svg.mjs
      - scripts/export-category-world-webp.cjs
      - .github/workflows/build-category-world-atlas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.repository == 'its-manos/project-gnosi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/category-island-atlas-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/generate-category-world-svg.mjs
      - run: node scripts/export-category-world-webp.cjs
      - name: Commit generated asset only when changed
        shell: bash
        run: |
          git add assets/atlas-source/category-world.svg assets/atlas-export-preview/category-world.webp
          if git diff --cached --quiet; then
            echo "Natural Earth world atlas and WebP already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(category): generate accurate Natural Earth globe SVG and WebP"
          git push origin HEAD:feat/category-island-atlas-v2
