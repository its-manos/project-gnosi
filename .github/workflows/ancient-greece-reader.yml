name: Ancient Greece reader compatibility

on:
  pull_request:
    branches:
      - content/curriculum-v1
  workflow_dispatch:

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run test:section-end-questions
      - run: node scripts/test-reader-pilot.cjs
      - run: node scripts/test-flexible-editorial.cjs
      - run: node scripts/test-editorial-compatibility.cjs
      - run: node scripts/test-learning-backup.cjs
      - run: node scripts/test-automatic-sync.cjs
      - run: node scripts/test-typed-lesson-integration.cjs
      - run: node scripts/test-typed-lesson-audio.cjs
      - run: node scripts/test-answer-sound-route.cjs
      - run: npm run test:question-types
