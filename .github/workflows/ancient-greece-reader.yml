name: Ancient Greece reader compatibility

on:
  pull_request:
    branches:
      - content/curriculum-v1
  workflow_dispatch:

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run test:section-end-questions
      - run: node scripts/test-reader-pilot.cjs
      - run: node scripts/test-flexible-editorial.cjs
      - run: node scripts/test-editorial-compatibility.cjs
      - run: node scripts/test-learning-backup.cjs
      - run: node scripts/test-automatic-sync.cjs
      - run: node scripts/test-typed-lesson-integration.cjs
      - run: node scripts/test-typed-lesson-audio.cjs
      - run: node scripts/test-play-audio.cjs
      - run: node scripts/test-answer-sound-route.cjs
      - run: npm run test:question-types
      - run: node scripts/test-ancient-greece-chapter1-questions.cjs
      - run: node scripts/test-ancient-greece-phase2-pair.cjs
      - run: node scripts/test-ancient-greece-phase2-3-4.cjs
      - run: node scripts/test-ancient-greece-phase2-5-6.cjs
      - run: node scripts/test-greek-intro-redesign.cjs
      - run: node scripts/test-greek-geography-lesson.cjs
      - run: node scripts/test-ancient-greece-chapter2-questions.cjs
      - run: node scripts/test-ancient-greece-phase2-7-8.cjs
      - run: node scripts/test-ancient-greece-phase2-9-10.cjs
      - run: node scripts/test-ancient-greece-phase2-11-12.cjs
      - run: node scripts/test-aegean-bronze-age.cjs
      - run: node scripts/test-minoan-crete.cjs
      - run: node scripts/test-mycenaean-palaces.cjs
      - run: node scripts/test-linear-b-decipherment.cjs
      - run: node scripts/test-palace-collapse.cjs
      - run: node scripts/test-geometric-greece.cjs
      - run: node scripts/test-ancient-greece-chapter3-questions.cjs
      - run: node scripts/test-ancient-greece-phase2-11-12.cjs
      - run: node scripts/test-ancient-greece-phase2-13-14.cjs
      - run: node scripts/test-ancient-greece-phase2-15-16.cjs
      - run: node scripts/test-ancient-greece-phase2-17-18.cjs
      - run: node scripts/test-rise-of-polis.cjs
      - run: node scripts/test-greek-settlements.cjs
      - run: node scripts/test-sparta-society.cjs
      - run: node scripts/test-athens-who-voted.cjs
      - run: node scripts/test-athens-law-courts.cjs
      - run: node scripts/test-greek-war-hoplites.cjs
      - run: node scripts/test-greek-sanctuaries-games.cjs
      - run: node scripts/test-ancient-greece-chapter4-questions.cjs
      - run: node scripts/test-ancient-greece-phase2-19-20.cjs
      - run: node scripts/test-ancient-greece-phase2-21-22.cjs
      - run: node scripts/test-ancient-greece-phase2-23-24.cjs
      - run: node scripts/test-persian-wars-greek-world.cjs
      - run: node scripts/test-athenian-empire.cjs
      - run: node scripts/test-peloponnesian-war.cjs
      - run: node scripts/test-greek-crises-fourth-century.cjs
      - run: node scripts/test-macedon-philip.cjs
