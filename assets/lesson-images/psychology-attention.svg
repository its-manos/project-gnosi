    <text x="600" y="595" font-size="35" text-anchor="middle">Ίδια σύμβολα · διαφορετικός στόχος</text>
    <text x="60" y="655" font-size="26" fill="#b9c7cb">Οι γραμμές επισημαίνουν τον στόχο στο σχήμα.</text>
    <text x="60" y="690" font-size="26" fill="#b9c7cb">Δεν είναι δοκιμασία απροσεξιακής τύφλωσης ή αξιολόγηση ικανότητας.</text>
