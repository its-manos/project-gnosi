      <circle cx="150" cy="285" r="33"/><circle cx="455" cy="435" r="33"/>
      <path d="M300 250L340 320H260Z M180 400L220 470H140Z"/>
      <rect x="405" y="255" width="65" height="65"/><rect x="280" y="400" width="65" height="65"/>
