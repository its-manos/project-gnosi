    <g text-anchor="middle" font-size="33">
      <text x="225" y="368">Η μουσική;</text><text x="225" y="415" fill="#a7d0cb">Υπόθεση Α</text>
      <text x="600" y="368">Περισσότερη</text><text x="600" y="415">μελέτη;</text>
      <text x="975" y="368">Προηγούμενες</text><text x="975" y="415">γνώσεις;</text>
