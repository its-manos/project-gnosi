<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2400" viewBox="0 0 1080 2400">
  <title>Gnosi Midnight Atlas — World Plate</title>
  <desc>A decorative, world-scale cartographic plate in dark blue, desaturated teal and antique bronze. All continents and coastlines are noninteractive; destination islands are rendered separately.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#10212F"/>
      <stop offset=".34" stop-color="#1A303C"/>
      <stop offset=".65" stop-color="#102333"/>
      <stop offset="1" stop-color="#0D1829"/>
    </linearGradient>
    <radialGradient id="central-light" cx=".52" cy=".52" r=".75">
      <stop offset="0" stop-color="#466476" stop-opacity=".29"/>
      <stop offset=".52" stop-color="#263F54" stop-opacity=".14"/>
      <stop offset="1" stop-color="#111B2D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ocean-light" cx=".4" cy=".28" r=".64">
      <stop offset="0" stop-color="#6D827D" stop-opacity=".11"/>
      <stop offset="1" stop-color="#0C1C2C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1=".1" x2=".95" y2="1">
      <stop offset="0" stop-color="#6C7979"/>
      <stop offset=".46" stop-color="#51666B"/>
      <stop offset="1" stop-color="#2C4651"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFAE91" stop-opacity=".46"/>
      <stop offset=".55" stop-color="#8FA6B0" stop-opacity=".23"/>
      <stop offset="1" stop-color="#B8A58C" stop-opacity=".40"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".52" cy=".52" r=".75">
      <stop offset="0" stop-color="#07101C" stop-opacity="0"/>
      <stop offset=".7" stop-color="#08111D" stop-opacity=".10"/>
      <stop offset="1" stop-color="#070F1C" stop-opacity=".48"/>
    </radialGradient>
  </defs>
  <!-- The decorative map is a whole-world scale, deliberately unlike the close Aegean lesson atlas. -->
  <rect width="1080" height="2400" fill="url(#sea)"/>
  <rect width="1080" height="2400" fill="url(#central-light)"/>
  <rect width="1080" height="2400" fill="url(#ocean-light)"/>

  <!-- Subtle engraved parallels, curved meridians, and a broad projection ring. -->
  <g fill="none" stroke="#96AFB9" stroke-width="1.3" opacity=".105">
    <path d="M 0 398 Q 540 358 1080 398 M 0 708 Q 540 675 1080 708 M 0 1018 Q 540 991 1080 1018 M 0 1328 Q 540 1307 1080 1328 M 0 1638 Q 540 1611 1080 1638 M 0 1948 Q 540 1910 1080 1948"/>
    <path d="M 163 245 Q 270 1200 174 2250 M 365 245 Q 417 1200 365 2250 M 540 245 L 540 2250 M 715 245 Q 663 1200 715 2250 M 917 245 Q 810 1200 906 2250"/>
  </g>
  <g fill="none" stroke="#D2B994" stroke-width="1" opacity=".105" stroke-dasharray="4 18">
    <ellipse cx="540" cy="1232" rx="508" ry="945"/>
    <ellipse cx="540" cy="1232" rx="448" ry="873"/>
    <path d="M 540 250 V 2264 M 25 1232 H 1055"/>
  </g>

  <!-- Bathymetry: irregular, widely spaced deep-water contours. -->
  <g fill="none" stroke="#83B3BE" stroke-width="2" opacity=".14">
    <path d="M 29 901 C 98 815 143 829 202 951 S 341 1055 366 1195 S 270 1410 336 1507"/>
    <path d="M 64 919 C 114 859 165 879 222 980 S 304 1127 333 1242 S 270 1416 298 1490"/>
    <path d="M 427 631 C 501 593 520 722 480 835 S 420 1080 481 1249 S 525 1520 479 1640"/>
    <path d="M 450 688 C 489 643 492 751 453 869 S 444 1090 500 1258"/>
    <path d="M 804 1046 C 902 1001 1012 1090 1005 1261 S 919 1423 994 1561"/>
    <path d="M 839 1100 C 914 1059 978 1137 958 1267 S 889 1439 949 1515"/>
    <path d="M 70 2089 Q 343 1981 570 2107 T 1057 2098"/>
  </g>

  <!-- World landmasses: broad silhouettes rather than the Aegean close-up. -->
  <g fill="url(#earth)" fill-opacity=".29" stroke="#C5B499" stroke-opacity=".45" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- North America, Alaska, Labrador, Florida and the Gulf -->
    <path d="M 13 456 L 73 420 L 111 443 L 152 420 L 209 435 L 243 466 L 308 468 L 336 497 L 358 547 L 335 594 L 311 621 L 324 660 L 300 706 L 325 749 L 311 797 L 335 822 L 327 876 L 297 913 L 283 960 L 269 950 L 261 892 L 231 862 L 221 822 L 188 799 L 167 837 L 133 817 L 114 780 L 89 750 L 55 713 L 33 659 L 24 599 L 6 560 Z"/>
    <path d="M 254 850 Q 279 864 298 911 L 319 961 L 299 982 L 277 960 Z"/>
    <!-- Greenland -->
    <path d="M 358 352 Q 386 310 436 325 Q 472 349 466 409 L 427 462 L 386 450 L 369 406 Z"/>
    <!-- South America: northern coast, Andes, Brazil, southern tip -->
    <path d="M 304 1052 Q 341 1016 379 1039 L 424 1051 L 466 1099 L 485 1169 L 463 1214 L 449 1281 L 453 1360 L 424 1425 L 427 1490 L 402 1576 L 379 1638 L 369 1716 L 340 1783 L 325 1870 L 308 1927 L 287 1850 L 284 1766 L 258 1697 L 262 1620 L 245 1550 L 258 1465 L 234 1370 L 241 1293 L 261 1204 L 256 1137 Z"/>
    <!-- Northern Europe and Scandinavia -->
    <path d="M 520 626 L 536 601 L 560 621 L 575 592 L 594 576 L 607 610 L 626 598 L 635 644 L 617 676 L 601 705 L 570 699 L 556 676 L 532 684 L 511 654 Z"/>
    <!-- British Isles -->
    <path d="M 487 690 L 500 671 L 511 695 L 505 729 L 489 725 Z"/>
    <path d="M 472 720 L 481 707 L 488 732 L 481 752 Z"/>
    <!-- Europe / Mediterranean and western Asia -->
    <path d="M 515 747 L 552 725 L 581 741 L 602 724 L 619 731 L 638 708 L 660 730 L 681 714 L 707 737 L 719 767 L 700 794 L 666 783 L 646 801 L 619 791 L 595 815 L 572 800 L 545 816 L 527 785 Z"/>
    <!-- Continental Asia, the broad northern and eastern hemisphere -->
    <path d="M 624 493 L 666 446 L 709 457 L 741 420 L 792 435 L 830 396 L 885 420 L 931 405 L 971 432 L 1023 431 L 1077 469 L 1080 709 L 1049 750 L 1038 798 L 1009 815 L 995 881 L 969 907 L 943 864 L 919 902 L 881 859 L 866 893 L 830 865 L 792 827 L 758 830 L 729 798 L 715 754 L 691 739 L 671 703 L 648 692 L 631 648 L 610 622 L 635 574 Z"/>
    <!-- Indian subcontinent -->
    <path d="M 784 835 L 827 841 L 852 876 L 846 935 L 824 996 L 807 1017 L 797 973 L 773 924 Z"/>
    <!-- Arabia -->
    <path d="M 681 847 L 721 857 L 759 898 L 742 941 L 704 938 L 676 897 Z"/>
    <!-- Africa, Gibraltar/Sahara to cape -->
    <path d="M 558 852 L 606 817 L 652 832 L 690 849 L 723 885 L 754 942 L 742 1002 L 771 1088 L 745 1184 L 724 1243 L 700 1351 L 669 1422 L 635 1511 L 607 1564 L 577 1500 L 564 1421 L 540 1364 L 526 1292 L 494 1205 L 491 1101 L 509 1019 L 522 939 Z"/>
    <!-- Madagascar -->
    <path d="M 786 1358 L 805 1372 L 813 1436 L 800 1505 L 781 1469 Z"/>
    <!-- Indochina and Indonesia -->
    <path d="M 876 936 L 902 959 L 925 1006 L 928 1061 L 951 1103 L 932 1137 L 908 1107 L 893 1045 L 876 1005 Z"/>
    <path d="M 899 1164 L 935 1173 L 950 1190 L 927 1203 Z"/>
    <path d="M 963 1191 L 999 1196 L 1022 1214 L 1002 1227 L 970 1216 Z"/>
    <!-- Australia / Oceania -->
    <path d="M 849 1589 L 890 1550 L 938 1556 L 969 1535 L 1014 1578 L 1044 1646 L 1020 1720 L 980 1749 L 947 1741 L 916 1780 L 877 1764 L 851 1724 L 833 1663 Z"/>
    <!-- Antarctica along the lower map edge -->
    <path d="M 32 2212 L 107 2180 L 186 2200 L 269 2175 L 336 2201 L 413 2184 L 487 2220 L 564 2189 L 648 2204 L 734 2188 L 834 2225 L 940 2190 L 1043 2208 L 1080 2270 L 1080 2400 L 0 2400 L 0 2250 Z"/>
  </g>

  <!-- Inland relief, faint plateaus and broken mountain belts. -->
  <g fill="none" stroke="#D1C7B0" stroke-width="1.7" stroke-linecap="round" opacity=".15">
    <path d="M 98 547 Q 141 605 158 685 T 231 803 M 114 570 Q 144 635 173 705"/>
    <path d="M 287 1192 Q 291 1380 303 1550 T 324 1752 M 310 1240 Q 308 1510 333 1679"/>
    <path d="M 562 916 Q 605 888 659 945 T 694 1060 M 555 959 Q 619 934 685 987"/>
    <path d="M 568 1170 Q 602 1267 641 1360 M 593 1136 Q 654 1277 667 1384"/>
    <path d="M 733 599 Q 796 648 869 652 T 982 725 M 744 634 Q 842 696 944 737"/>
    <path d="M 822 809 Q 878 802 943 840 M 807 830 Q 860 826 909 871"/>
    <path d="M 885 1659 Q 929 1648 993 1683 M 902 1700 Q 965 1692 995 1723"/>
  </g>

  <!-- Coastal shoals and local contour tracings. -->
  <g fill="none" stroke="#A1C4C8" stroke-width="1.8" opacity=".16">
    <path d="M 12 433 Q 107 383 213 407 T 358 490 M 21 770 Q 78 849 151 875 T 286 1032"/>
    <path d="M 229 1093 Q 191 1289 220 1506 T 288 1905"/>
    <path d="M 483 820 Q 467 939 456 1045 T 481 1240 Q 509 1472 576 1577"/>
    <path d="M 623 399 Q 814 332 1068 395 M 1001 862 Q 1074 997 1008 1136"/>
    <path d="M 825 1555 Q 779 1665 829 1795 T 1047 1840"/>
  </g>

  <!-- Fine compass rose placed away from island labels. -->
  <g transform="translate(918 2075)" opacity=".45">
    <circle r="51" fill="none" stroke="#CDBB96" stroke-width="1.3" stroke-opacity=".55"/>
    <circle r="37" fill="none" stroke="#B1C3CA" stroke-width=".8" stroke-opacity=".5"/>
    <path d="M 0 -65 L 8 -9 L 65 0 L 8 9 L 0 65 L -8 9 L -65 0 L -8 -9 Z"
      fill="#D2BE99" fill-opacity=".17" stroke="#D0BA93" stroke-width="1.3"/>
    <path d="M 0 -51 L 0 51 M -51 0 H 51" stroke="#D9D3BC" stroke-width="1.1" opacity=".65"/>
    <circle r="5" fill="#CEC09B"/>
  </g>
  <g fill="none" stroke="#D2BB96" opacity=".27" stroke-width="1.5">
    <path d="M 68 126 V 165 M 49 145 H 87 M 1010 126 V 165 M 991 145 H 1029"/>
    <path d="M 68 2308 V 2269 M 49 2289 H 87 M 1010 2308 V 2269 M 991 2289 H 1029"/>
  </g>
  <!-- Aged survey marks are intentionally sparse under the live island labels. -->
  <g fill="#D7C8A8" opacity=".28">
    <circle cx="187" cy="1182" r="3.5"/><circle cx="940" cy="1321" r="3.5"/>
    <circle cx="735" cy="2020" r="2.6"/><circle cx="401" cy="1861" r="2.6"/>
    <circle cx="547" cy="489" r="2.9"/><circle cx="103" cy="1687" r="2.9"/>
  </g>
  <rect width="1080" height="2400" fill="url(#vignette)"/>
  <rect x="18" y="22" width="1044" height="2356" rx="18" fill="none"
    stroke="url(#rim)" stroke-opacity=".50" stroke-width="2"/>
  <rect x="29" y="33" width="1022" height="2334" rx="11" fill="none"
    stroke="#A2B7BE" stroke-opacity=".13" stroke-width="1"/>
</svg>